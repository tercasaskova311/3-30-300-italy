<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3-30-300 Italy</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; }
    #panel { position: absolute; top: 12px; left: 12px; background: white;
             padding: 10px 14px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel"><strong>3-30-300 compliance</strong><br><small>Italian cities</small></div>

  <script>
    // PMTiles support (works once you add a .pmtiles file)
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/positron",   // free basemap, no API key
      center: [11.34, 44.49],
      zoom: 12
    });
    map.addControl(new maplibregl.NavigationControl());

          "circle-color": ["case", ["==", ["get", "r300"], 1], "#22C55E", "#DC2626"]

    */
  </script>
</body>
</html>
